[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "AI-plane orchestrator — agent-runtime (issue #6 keystone, Architect #6 BAND-3-DESIGN)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "langgraph>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests", "app"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
pythonpath = ["..", "../.."]
