name: ci-hello-world
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test-lint-build:
    name: test + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/hello-world/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/hello-world
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        working-directory: services/hello-world
        run: python -m pytest app/ -v
      - name: Run linter
        working-directory: services/hello-world
        run: python -m ruff check app/
      - name: Build Docker image
        run: docker build -t ventureminer/hello-world:ci-${{ github.sha }} services/hello-world/
      - name: Smoke-test the image
        # The smoke test runs the image in detached mode with a unique
        # name (so a leftover container from a previous failed run does
        # not cause a name-collision failure) and polls the healthz +
        # readyz endpoints until they answer (or 30 s elapses). The
        # container is then stopped; if it already exited (e.g. a
        # healthcheck failure inside the image) the stop is allowed to
        # fail without failing the step, so the docker logs are
        # preserved in the CI output for debugging.
        run: |
          NAME="hw-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --rm -d --name "$NAME" -p 8000:8000 ventureminer/hello-world:ci-${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null 2>&1 \
               && curl --fail --silent http://localhost:8000/readyz  >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs "$NAME" || true
          docker stop  "$NAME" || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::hello-world image did not become healthy within 30 s"
            exit 1
          fi
          echo "OK: /healthz and /readyz both answered"
  test-auth-svc:
    name: auth-svc tests (backend=${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, redis]
    # The `services:` block is GHA-native: it starts a container, waits for
    # the healthcheck to pass, and exposes the listed port on localhost.
    # We declare it UNCONDITIONALLY (not gated by `if: matrix.backend == 'redis'`)
    # because the healthcheck-driven startup takes ~1 s on ubuntu-latest
    # (redis:7-alpine cold start + redis-server readiness), which is well
    # under our ~10 s budget. Gating it would add an `if:` step with
    # conditional-service semantics that the GHA docs flag as
    # "best-effort, may race" — see
    # https://docs.github.com/en/actions/using-containerized-services
    # The unconditional path is the documented-supported path.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    env:
      AUTH_SVC_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/auth-svc/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/auth-svc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests (backend=${{ matrix.backend }})
        working-directory: services/auth-svc
        run: |
          if [ "${{ matrix.backend }}" = "redis" ]; then
            # Wait for the Redis service to be reachable; the `services:`
            # healthcheck should have already done this, but a defensive
            # retry makes the suite robust to a slow runner image.
            for i in $(seq 1 30); do
              if redis-cli ping >/dev/null 2>&1; then break; fi
              sleep 1
            done
            AUTH_SVC_REDIS_URL=redis://localhost:6379/15 \
              python -m pytest app/test_redis_session_manager.py -v
          else
            python -m pytest app/test_session_manager.py -v
          fi
      - name: Run linter
        working-directory: services/auth-svc
        run: python -m ruff check app/
